name: Hardhat Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fruit-market/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fruit-market

      - name: Compile contracts
        run: npx hardhat compile
        working-directory: fruit-market

      - name: Run tests
        run: npx hardhat test
        working-directory: fruit-market